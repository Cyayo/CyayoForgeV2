# ---------------------------------------------------------
# CyayoForgeV2 - Traits, Effectiveness & Modifiers
# ---------------------------------------------------------
# Di sini Anda mendefinisikan item-item Ingredient yang dapat ditaruh
# pada slot ingredients di GUI Forge untuk memodifikasi hasil tempaan.
#
# Setiap item bisa memiliki salah satu atau kombinasi dari:
# 1. traits        : Bonus stats yang dibagi per WEAPON dan ARMOR (min-max atau flat).
# 2. effectiveness : Pengaruh posisi terhadap slot ingredient lain di sekitarnya.
#                    (below, above, left, right, touching, not-touching).

items:
  # =======================================================================================
  #                                      MAP 1
  # =======================================================================================
  "MATERIAL_INGREDIENT:AT_ARMORS":
    traits:
      ARMOR:
        - "ARMOR:1-2"
        - "MAX_HEALTH:4-8"
      WEAPON:
        - "KNOCKBACK_RESISTANCE:0.05-0.1"
    effectiveness:
      - below: "+20%"
      - above: "-10%"

  "MATERIAL_INGREDIENT:AT_EYES":
